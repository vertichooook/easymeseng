<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Вход | Nexus</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/nexus-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/nexus-maskable.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="16" height="11" x="4" y="11" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
  </svg>
  <main class="auth-card">
    <div class="auth-logo">
      <span class="logo-mark large">N</span>
      <span><strong>Nexus</strong><small>Secure command messenger</small></span>
    </div>
    <h1>Вход</h1>
    <p>Войдите по username и паролю.</p>
    <form id="loginForm" class="auth-form">
      <label><span>Username</span><div class="input-shell"><svg><use href="#i-user"></use></svg><input name="username" autocomplete="username" required minlength="3" maxlength="32"></div></label>
      <label><span>Пароль</span><div class="input-shell"><svg><use href="#i-lock"></use></svg><input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></div></label>
      <button type="submit">Войти <svg><use href="#i-arrow-right"></use></svg></button>
      <div id="notice" class="notice" role="status"></div>
    </form>
    <a href="/register.html">Создать аккаунт</a>
  </main>
  <script src="/js/pwa.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
