<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход | Messenger</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Вход</h1>
    <p>Войдите по username и паролю.</p>
    <form id="loginForm" class="auth-form">
      <label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="32"></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label>
      <button type="submit">Войти</button>
      <div id="notice" class="notice" role="status"></div>
    </form>
    <a href="/register.html">Создать аккаунт</a>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
