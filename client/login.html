<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17202a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Вход | Nexus</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/nexus-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/nexus-maskable.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-logo">
      <span class="logo-mark large">N</span>
      <strong>Nexus</strong>
    </div>
    <h1>Вход</h1>
    <p>Войдите по username и паролю.</p>
    <form id="loginForm" class="auth-form">
      <label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="32"></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label>
      <button type="submit">Войти</button>
      <div id="notice" class="notice" role="status"></div>
    </form>
    <a href="/register.html">Создать аккаунт</a>
  </main>
  <script src="/js/pwa.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
