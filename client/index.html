<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nexus</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-desktop">
      <span class="logo-mark large">N</span>
      <div>
        <strong>Nexus</strong>
        <p>Подключаем чаты и синхронизируем сообщения</p>
      </div>
    </div>
    <div class="loading-mobile">
      <span class="logo-mark large">N</span>
      <strong>Nexus</strong>
      <p>Готовим мобильный чат</p>
    </div>
  </div>

  <div class="app-shell">
    <nav class="nav-rail" aria-label="Nexus">
      <span class="logo-mark">N</span>
      <button class="rail-button active" type="button" data-rail-action="chats" title="Chats" aria-label="Chats">
        <span class="rail-icon rail-chat"></span>
      </button>
      <button class="rail-button" type="button" data-rail-action="rooms" title="Rooms" aria-label="Rooms">
        <span class="rail-icon rail-rooms"></span>
      </button>
      <button class="rail-button" type="button" data-rail-action="people" title="People" aria-label="People">
        <span class="rail-icon rail-users"></span>
      </button>
      <button id="settingsButton" class="rail-button rail-bottom" type="button" title="Settings" aria-label="Settings">
        <span class="rail-icon rail-settings"></span>
      </button>
    </nav>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-lockup">
          <span class="logo-mark">N</span>
          <strong>Nexus</strong>
        </div>
        <button id="closeSidebar" class="icon-button ghost" type="button" title="Закрыть">×</button>
      </div>
      <section class="panel-section rooms-panel" data-sidebar-panel="rooms">
        <div class="section-title">
          <span>Комнаты</span>
          <button id="openRoomModal" class="icon-button" type="button" title="Создать комнату">+</button>
        </div>
        <div id="roomsList" class="list"></div>
      </section>
      <section class="panel-section users-section" data-sidebar-panel="chats">
        <div class="section-title"><span>Личные сообщения</span></div>
        <div id="usersList" class="list"></div>
      </section>
      <section class="panel-section people-section" data-sidebar-panel="people" hidden>
        <div class="section-title"><span>People</span></div>
        <label class="people-search">
          <input id="peopleSearchInput" type="search" autocomplete="off" placeholder="@username">
          <button id="peopleSearchButton" type="button">Найти</button>
        </label>
        <div id="peopleContactsList" class="list people-contacts"></div>
        <div id="peopleSearchResults" class="list people-results"></div>
      </section>
      <section class="profile-mini">
        <button id="profileButton" type="button"></button>
        <button id="logoutButton" type="button">Выйти</button>
      </section>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button id="openSidebar" class="icon-button menu-button" type="button" title="Меню">☰</button>
        <button id="chatHeaderButton" class="chat-title-button" type="button">
          <span id="chatAvatar" class="avatar small">#</span>
          <span>
            <strong id="chatTitle">Общий чат</strong>
            <small id="connectionStatus" class="status">подключение...</small>
          </span>
        </button>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing"></div>
      <form id="messageForm" class="composer">
        <div id="replyBar" class="reply-bar" hidden></div>
        <input id="fileInput" type="file" accept="image/*,video/*" hidden>
        <button id="attachButton" class="icon-button ghost media-icon attach-icon" type="button" title="Фото или видео" aria-label="Фото или видео"></button>
        <button id="recordButton" class="icon-button ghost media-icon mic-icon" type="button" title="Тап: голос/видео. Удерживайте для записи" aria-label="Запись"></button>
        <textarea id="messageInput" maxlength="1000" placeholder="Напишите сообщение" rows="1"></textarea>
        <button id="sendButton" type="submit">Отправить</button>
      </form>
    </main>

    <aside class="inspector-panel" id="inspectorPanel">
      <div class="inspector-card">
        <div id="inspectorAvatar" class="inspector-avatar"></div>
        <strong id="inspectorTitle">Nexus</strong>
        <span id="inspectorMeta">Workspace</span>
      </div>
      <div class="inspector-members">
        <div class="inspector-section-title">Participants</div>
        <div id="inspectorMembersList" class="inspector-members-list"></div>
      </div>
    </aside>
  </div>

  <div id="contextMenu" class="context-menu" hidden>
    <button type="button" data-menu-action="reply">Ответить</button>
    <button type="button" data-menu-action="forward">Переслать</button>
    <button type="button" data-menu-action="delete">Удалить</button>
  </div>

  <div id="recordPreviewOverlay" class="record-preview-overlay" hidden>
    <video id="recordLivePreview" class="record-live-preview" autoplay muted playsinline></video>
    <button id="switchCameraButton" class="camera-switch-button" type="button" title="Сменить камеру" aria-label="Сменить камеру">↻</button>
    <div class="record-preview-status">
      <span class="record-dot"></span>
      <span id="recordTimer">00:00</span>
    </div>
  </div>

  <dialog id="deleteModal">
    <form id="deleteForm" class="modal-form">
      <h2>Удалить сообщение?</h2>
      <p>По умолчанию сообщение исчезнет только у вас.</p>
      <label class="check-row"><input id="deleteForAll" type="checkbox"> Удалить у всех</label>
      <menu>
        <button id="cancelDelete" type="button">Отмена</button>
        <button class="danger-fill" type="submit">Удалить</button>
      </menu>
    </form>
  </dialog>

  <dialog id="settingsModal">
    <div class="modal-form">
      <h2>Настройки Nexus</h2>
      <button id="themeButton" type="button">Переключить тему</button>
      <button id="notifyButton" type="button">Разрешить уведомления</button>
      <button id="copyUsernameButton" type="button">Скопировать username</button>
      <p class="muted-text" id="settingsUsername"></p>
      <button id="closeSettings" type="button">Закрыть</button>
    </div>
  </dialog>

  <dialog id="roomSettingsModal">
    <form id="roomSettingsForm" class="modal-form">
      <h2>Комната</h2>
      <div id="roomAvatarPreview" class="avatar-preview"></div>
      <input id="roomAvatarInput" type="file" accept="image/*">
      <div id="roomMembers" class="members-list"></div>
      <div id="inviteSearch" class="invite-search" hidden>
        <label>Найти по username<input id="userSearchInput" type="search" autocomplete="off" placeholder="@username"></label>
        <div id="userSearchResults" class="search-results"></div>
      </div>
      <menu>
        <button id="muteButton" type="button">Мут</button>
        <button id="inviteButton" type="button">Пригласить</button>
        <button id="deleteRoomButton" class="danger-fill" type="button">Удалить</button>
        <button id="closeRoomSettings" type="button">Закрыть</button>
        <button type="submit">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <dialog id="roomModal">
    <form id="roomForm" method="dialog" class="modal-form">
      <h2>Новая комната</h2>
      <input name="name" required minlength="2" maxlength="60" placeholder="Название комнаты">
      <menu>
        <button value="cancel" type="button" id="cancelRoom">Отмена</button>
        <button type="submit">Создать</button>
      </menu>
    </form>
  </dialog>

  <dialog id="profileModal">
    <form id="profileForm" class="modal-form">
      <h2>Профиль</h2>
      <div class="avatar-preview" id="profileAvatar"></div>
      <label>Имя<input name="display_name" required minlength="2" maxlength="48"></label>
      <label>Username<input name="username" required minlength="3" maxlength="32"></label>
      <input id="avatarInput" type="file" accept="image/*">
      <menu>
        <button id="closeProfile" type="button">Закрыть</button>
        <button type="submit">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <dialog id="videoPreviewModal">
    <div class="modal-form">
      <h2>Предпросмотр видео</h2>
      <video id="videoPreview" class="video-preview" controls playsinline></video>
      <menu>
        <button id="cancelVideoPreview" type="button">Отмена</button>
        <button id="sendVideoPreview" type="button">Отправить</button>
      </menu>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status">
    <span id="toastText"></span>
    <button id="toastClose" type="button" title="Закрыть">×</button>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
