<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-lockup">
          <span class="logo-mark">N</span>
          <strong>Nexus</strong>
        </div>
        <button id="settingsButton" class="icon-button ghost" type="button" title="Настройки">S</button>
        <button id="closeSidebar" class="icon-button ghost" type="button" title="Закрыть">×</button>
      </div>
      <section class="panel-section">
        <div class="section-title">
          <span>Комнаты</span>
          <button id="openRoomModal" class="icon-button" type="button" title="Создать комнату">+</button>
        </div>
        <div id="roomsList" class="list"></div>
      </section>
      <section class="panel-section users-section">
        <div class="section-title"><span>Пользователи</span></div>
        <div id="usersList" class="list"></div>
      </section>
      <section class="profile-mini">
        <button id="profileButton" type="button"></button>
        <button id="logoutButton" type="button">Выйти</button>
      </section>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button id="openSidebar" class="icon-button menu-button" type="button" title="Меню">☰</button>
        <button id="chatHeaderButton" class="chat-title-button" type="button">
          <span id="chatAvatar" class="avatar small">#</span>
          <span>
            <strong id="chatTitle">Общий чат</strong>
            <small id="connectionStatus" class="status">подключение...</small>
          </span>
        </button>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing"></div>
      <form id="messageForm" class="composer">
        <div id="replyBar" class="reply-bar" hidden></div>
        <input id="fileInput" type="file" accept="image/*,video/*" hidden>
        <button id="attachButton" class="icon-button ghost" type="button" title="Фото или видео">F</button>
        <button id="voiceButton" class="icon-button ghost" type="button" title="Голосовое">A</button>
        <button id="videoButton" class="icon-button ghost" type="button" title="Видео">V</button>
        <textarea id="messageInput" maxlength="1000" placeholder="Напишите сообщение" rows="1"></textarea>
        <button id="sendButton" type="submit">Отправить</button>
      </form>
    </main>
  </div>

  <div id="contextMenu" class="context-menu" hidden>
    <button type="button" data-menu-action="reply">Ответить</button>
    <button type="button" data-menu-action="forward">Переслать</button>
    <button type="button" data-menu-action="delete">Удалить</button>
  </div>

  <dialog id="deleteModal">
    <form id="deleteForm" class="modal-form">
      <h2>Удалить сообщение?</h2>
      <p>По умолчанию сообщение исчезнет только у вас.</p>
      <label class="check-row"><input id="deleteForAll" type="checkbox"> Удалить у всех</label>
      <menu>
        <button id="cancelDelete" type="button">Отмена</button>
        <button class="danger-fill" type="submit">Удалить</button>
      </menu>
    </form>
  </dialog>

  <dialog id="settingsModal">
    <div class="modal-form">
      <h2>Настройки Nexus</h2>
      <button id="themeButton" type="button">Переключить тему</button>
      <button id="notifyButton" type="button">Разрешить уведомления</button>
      <button id="copyUsernameButton" type="button">Скопировать username</button>
      <p class="muted-text" id="settingsUsername"></p>
      <button id="closeSettings" type="button">Закрыть</button>
    </div>
  </dialog>

  <dialog id="roomSettingsModal">
    <form id="roomSettingsForm" class="modal-form">
      <h2>Комната</h2>
      <div id="roomAvatarPreview" class="avatar-preview"></div>
      <input id="roomAvatarInput" type="file" accept="image/*">
      <div id="roomMembers" class="members-list"></div>
      <menu>
        <button id="muteButton" type="button">Мут</button>
        <button id="inviteButton" type="button">Пригласить</button>
        <button id="deleteRoomButton" class="danger-fill" type="button">Удалить</button>
        <button id="closeRoomSettings" type="button">Закрыть</button>
        <button type="submit">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <dialog id="roomModal">
    <form id="roomForm" method="dialog" class="modal-form">
      <h2>Новая комната</h2>
      <input name="name" required minlength="2" maxlength="60" placeholder="Название комнаты">
      <menu>
        <button value="cancel" type="button" id="cancelRoom">Отмена</button>
        <button type="submit">Создать</button>
      </menu>
    </form>
  </dialog>

  <dialog id="profileModal">
    <form id="profileForm" class="modal-form">
      <h2>Профиль</h2>
      <div class="avatar-preview" id="profileAvatar"></div>
      <label>Имя<input name="display_name" required minlength="2" maxlength="48"></label>
      <label>Username<input name="username" required minlength="3" maxlength="32"></label>
      <input id="avatarInput" type="file" accept="image/*">
      <menu>
        <button id="closeProfile" type="button">Закрыть</button>
        <button type="submit">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status">
    <span id="toastText"></span>
    <button id="toastClose" type="button" title="Закрыть">×</button>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
