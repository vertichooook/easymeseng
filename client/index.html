<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messenger</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <strong>Messenger</strong>
        <button id="themeButton" class="icon-button ghost" type="button" title="Тема">◐</button>
        <button id="closeSidebar" class="icon-button ghost" type="button" title="Закрыть">×</button>
      </div>
      <section class="panel-section">
        <div class="section-title">
          <span>Комнаты</span>
          <button id="openRoomModal" class="icon-button" type="button" title="Создать комнату">+</button>
        </div>
        <div id="roomsList" class="list"></div>
      </section>
      <section class="panel-section users-section">
        <div class="section-title"><span>Пользователи</span></div>
        <div id="usersList" class="list"></div>
      </section>
      <section class="profile-mini">
        <button id="profileButton" type="button"></button>
        <button id="logoutButton" type="button">Выйти</button>
      </section>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button id="openSidebar" class="icon-button menu-button" type="button" title="Меню">☰</button>
        <div>
          <h1 id="chatTitle">Общий чат</h1>
          <span id="connectionStatus" class="status">подключение...</span>
        </div>
        <div class="chat-actions">
          <button id="notifyButton" class="icon-button ghost" type="button" title="Уведомления">!</button>
          <button id="muteButton" class="icon-button ghost" type="button" title="Мут">M</button>
          <button id="inviteButton" class="icon-button ghost" type="button" title="Пригласить">+</button>
          <button id="deleteRoomButton" class="icon-button ghost danger-button" type="button" title="Удалить комнату">×</button>
        </div>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="typing" class="typing"></div>
      <form id="messageForm" class="composer">
        <div id="replyBar" class="reply-bar" hidden></div>
        <input id="fileInput" type="file" accept="image/*,video/*" hidden>
        <button id="attachButton" class="icon-button ghost" type="button" title="Картинка или видео">＋</button>
        <button id="voiceButton" class="icon-button ghost" type="button" title="Голосовое сообщение">●</button>
        <button id="videoButton" class="icon-button ghost" type="button" title="Видеосообщение">▣</button>
        <textarea id="messageInput" maxlength="1000" placeholder="Напишите сообщение" rows="1"></textarea>
        <button id="sendButton" type="submit">Отправить</button>
      </form>
    </main>
  </div>

  <dialog id="roomModal">
    <form id="roomForm" method="dialog" class="modal-form">
      <h2>Новая комната</h2>
      <input name="name" required minlength="2" maxlength="60" placeholder="Название комнаты">
      <menu>
        <button value="cancel" type="button" id="cancelRoom">Отмена</button>
        <button type="submit">Создать</button>
      </menu>
    </form>
  </dialog>

  <dialog id="profileModal">
    <form id="profileForm" class="modal-form">
      <h2>Профиль</h2>
      <div class="avatar-preview" id="profileAvatar"></div>
      <label>Имя пользователя<input name="username" required minlength="3" maxlength="32"></label>
      <input id="avatarInput" type="file" accept="image/*">
      <menu>
        <button id="closeProfile" type="button">Закрыть</button>
        <button type="submit">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
